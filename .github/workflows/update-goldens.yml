# Renders the golden images on Linux, the platform CI compares them on
# (test/widget/golden.dart), and uploads them as the `goldens` artifact.
# Nothing is pushed: download the artifact, unpack it in the repository root
# and commit the PNGs with the change that altered them.
#
#   gh workflow run update-goldens.yml --ref <branch>
#   gh run download --name goldens && tar -xf goldens.tar && rm goldens.tar
#
# Actions are pinned by commit SHA (the tag is in the comment).

name: Update goldens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Render goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      # Integration tests read the seed credentials when loaded; skip them.
      - run: flutter test --tags golden --exclude-tags integration --update-goldens
      # A tar keeps the paths relative to the repository root.
      - run: find test -path '*/goldens/*.png' | tar -cf goldens.tar -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: goldens.tar
          retention-days: 7
          if-no-files-found: error

<div style="font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 20px; display: flex; flex-wrap: wrap; gap: 8px; max-width: 400px">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&amp;display=swap" rel="stylesheet">
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 8px 0 12px; border-radius: 18px; border: 0; background: var(--sage-soft); color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>enthält Karotten<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
<button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 0; background: var(--sage-soft); color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Vegetarisch</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800">unter 30 Min</button>
<button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800">ab 4 Sternen</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 2px dashed var(--control-border); background: transparent; color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Filter</button>
</div>

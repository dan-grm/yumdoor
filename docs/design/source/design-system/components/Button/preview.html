<div style="font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 380px">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<button type="button" style="height: 56px; border-radius: 28px; border: 0; background: var(--sage); color: var(--on-sage); font-family: var(--font-sans); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Timer starten · 25:00</button>
<div style="display: flex; gap: 12px">
<button type="button" aria-label="Zurück" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 2px solid var(--control-border); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button type="button" style="flex: 1; height: 56px; border-radius: 28px; border: 0; background: var(--ink); color: var(--on-ink); font-family: var(--font-sans); font-size: 17px; font-weight: 800">Weiter zu Schritt 4</button>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 2px solid var(--control-border); background: transparent; color: var(--ink); font-family: var(--font-sans); font-size: 15px; font-weight: 800">Abbrechen</button>
<button type="button" aria-label="Schließen" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button type="button" aria-label="Bildschirm bleibt an" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--sage-soft); color: var(--sage); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 0; background: var(--danger); color: var(--on-danger); font-family: var(--font-sans); font-size: 15px; font-weight: 800">Löschen</button>
</div>
</div>

<!-- @dsCard group="Cooking" height=190 subtitle="Checked and unchecked" -->
<ul style="font-family: var(--font-sans); background: var(--bg); color: var(--ink); list-style: none; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 2px; max-width: 380px">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap" rel="stylesheet">
<li style="display: flex; align-items: center; gap: 6px; height: 48px">
<button type="button" aria-pressed="true" aria-label="Karotten abhaken" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: var(--sage); color: var(--on-sage); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
<span style="flex: 1; font-size: 17px; font-weight: 600; color: var(--ink-muted); text-decoration: line-through">Karotten</span>
<span style="padding: 6px 12px; border-radius: 999px; background: var(--surface-sunken); color: var(--ink-muted); font-size: 15px; font-weight: 800">600 g</span>
</li>
<li style="display: flex; align-items: center; gap: 6px; height: 48px">
<button type="button" aria-pressed="false" aria-label="Olivenöl abhaken" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid var(--control-border)"></span></button>
<span style="flex: 1; font-size: 17px; font-weight: 600">Olivenöl</span>
<span style="padding: 6px 12px; border-radius: 999px; background: var(--sage-soft); color: var(--ink); font-size: 15px; font-weight: 800">2 EL</span>
</li>
<li style="display: flex; align-items: center; gap: 6px; height: 48px">
<button type="button" aria-pressed="false" aria-label="Kreuzkümmel abhaken" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid var(--control-border)"></span></button>
<span style="flex: 1; font-size: 17px; font-weight: 600">Kreuzkümmel, gemahlen</span>
<span style="padding: 6px 12px; border-radius: 999px; background: var(--sage-soft); color: var(--ink); font-size: 15px; font-weight: 800">1 TL</span>
</li>
</ul>

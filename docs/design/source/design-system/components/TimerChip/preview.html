<!-- @dsCard group="Cooking" height=150 subtitle="Running, finished, inline highlight" -->
<div style="font-family: var(--font-sans); background: var(--bg); color: var(--ink); padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 380px">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<div style="display: flex; gap: 8px">
<div style="height: 36px; padding: 0 12px; border-radius: 18px; background: var(--butter); color: var(--on-butter); display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="font-size: 13px; font-weight: 700">Ofen</span>
<span style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">04:12</span>
</div>
<div style="height: 36px; padding: 0 12px; border-radius: 18px; background: var(--sage); color: var(--on-sage); display: flex; align-items: center; gap: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span style="font-size: 13px; font-weight: 700">Nudeln</span>
<span style="font-size: 15px; font-weight: 800">fertig</span>
</div>
</div>
<p style="margin: 0; font-size: 21px; line-height: 30px; font-weight: 600">… mischen und <span style="background: var(--butter); color: var(--on-butter); border-radius: 8px; padding: 0 6px; font-weight: 800">25 Minuten</span> rösten.</p>
</div>

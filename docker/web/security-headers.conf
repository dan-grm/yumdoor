# Included in every location of yumdoor.conf.template: nginx drops server-level
# add_header directives in a location that has its own.
#
# CSP: CanvasKit and sqlite3 are WebAssembly ('wasm-unsafe-eval', no
# 'unsafe-eval'); Flutter sets inline styles on its elements. Everything else,
# including the Tandoor API and media, is same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

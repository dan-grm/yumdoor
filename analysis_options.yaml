include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - web/**
    # Generated code: regenerate instead of fixing lints by hand.
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - lib/l10n/generated/**
    - packages/tandoor_api/lib/**

linter:
  rules:
    always_declare_return_types: true
    prefer_single_quotes: true

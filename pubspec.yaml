name: yumdoor
description: "A friendly client for self-hosted Tandoor Recipes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

workspace:
  - packages/tandoor_api

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  intl: 0.20.3
  json_annotation: 4.12.0
  riverpod_annotation: 4.0.7
  tandoor_api:
    path: packages/tandoor_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.16.2
  riverpod_generator: 4.0.9
  freezed: 4.0.3
  json_serializable: 6.15.1
  # tool/check_imports.dart
  analyzer: 14.5.0
  path: 1.9.1
  # tool/gen_tokens.dart
  dart_style: 3.1.14
  pub_semver: 2.2.1

flutter:
  generate: true
  uses-material-design: true

  # Bundled, not loaded from Google Fonts: no third-party requests, works offline.
  # License: assets/fonts/nunito/OFL.txt, registered with LicenseRegistry in main.dart.
  assets:
    - assets/fonts/nunito/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
